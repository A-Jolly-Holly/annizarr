# After every push to main (or on demand): the suite on a fresh pip resolve of the latest
# releases, the versions a user gets from `pip install annizarr` today. Pins are lower-bound
# only, so this is where an upstream release first shows up as a failure.
name: dependency-versions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  latest-all-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install ".[icechunk,dev]"
      - run: pip freeze | grep -iE '^(anndata|zarr|icechunk|pandas|numpy|scipy|h5py)=='
      - run: ruff check src tests docs
      - run: ruff format --check src tests docs
      - run: mypy --strict src/annizarr
      - run: pytest

  latest-core:
    # hard deps only, against today's releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install . pytest pytest-cov hypothesis
      - run: pytest --no-cov
