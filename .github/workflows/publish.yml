# Tag-driven publish: pushing vX.Y.Z builds the wheel and uploads it to PyPI. The GitHub release is
# cut by hand afterwards with ./Release_run.sh, since Release_notes.md is not in the repository.
name: annizarr-publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install build twine

      - name: Tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -oE '"[^"]+"' src/annizarr/_version.py | tr -d '"')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != _version.py $pkg"; exit 1; }

      - run: python -m build

      - run: twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
