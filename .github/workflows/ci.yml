# PR and push gate on the locked pixi environments: the same versions as local development, so an
# upstream release never turns a PR red on its own. Fresh-resolve testing lives in deps.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: default core
          locked: true
          cache: true

      - run: pixi run -e default ruff check src tests docs
      - run: pixi run -e default ruff format --check src tests docs
      - run: pixi run -e default mypy --strict src/annizarr
      - run: pixi run -e default pytest  # coverage gate is in pyproject.toml
      - run: pixi run -e core pytest --no-cov  # hard deps only: the extras stay optional

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
