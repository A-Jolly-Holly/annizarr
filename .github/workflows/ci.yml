# Every PR and push installs fresh from PyPI, the way a user does, and runs the gates at both ends of
# the supported Python range: `all` on the newest Python that has h5py wheels, with every extra, `core` on the 3.12 floor
# with the hard dependencies only, anndata and pandas pinned to their floors. The slow memory-ceiling
# test runs on pushes to main and on manual dispatch.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'  # not 3.x: h5py has no 3.15 wheels yet (its 3.17 release will); bump then

      - run: pip install ".[icechunk,dev]"
      - run: pip freeze | grep -iE '^(anndata|zarr|icechunk|pandas|numpy|scipy|h5py)=='
      - run: ruff check src tests docs
      - run: ruff format --check src tests docs
      - run: mypy --strict src/annizarr
      - run: pytest  # coverage gate is in pyproject.toml
      - name: worker count under a real affinity mask and container CPU quota
        # the unit tests fake the cgroup files; this reads real ones (quota 1.5 rounds up to 2)
        run: |
          taskset -c 0 python -c "from annizarr._core._system import usable_cpus as u; assert u() == 1, u()"
          docker run --rm --cpus=1.5 -v "$PWD/src:/src:ro" -e PYTHONPATH=/src python:3.14-slim \
            python -c "from annizarr._core._system import usable_cpus as u; assert u() == 2, u()"
      - if: github.event_name != 'pull_request'
        run: pytest -m slow --no-cov  # a few minutes, out of core testing

  core:
    # hard deps only, at the floor: the oldest supported Python, anndata and pandas at their lower bounds
    # (anndata 0.12 shipped against pandas 2); the extras stay optional and the floor holds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install . "anndata==0.12.7" "pandas~=2.3.0" pytest pytest-cov hypothesis
      - run: pip freeze | grep -iE '^(anndata|zarr|pandas|numpy|scipy|h5py)=='
      - run: pytest --no-cov

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
