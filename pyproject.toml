[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annizarr"
dynamic = ["version"]
description = "AnnData zarr stores: convert, edit, and version with Icechunk"
readme = "README.md"
requires-python = ">=3.12"  # zarr>=3.3 needs >=3.12
license = "MIT"
authors = [{ name = "Alex Holly", email = "alex.holly@alleninstitute.org" }]
keywords = ["anndata", "zarr", "icechunk", "single-cell", "scrna-seq"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "anndata>=0.12.7",  # 0.12.7 fixed backed sparse slicing on scipy>=1.17; 0.13 lists X in .layers under None, handled either way
  "pandas>=2.3",  # imported directly (frame prep, append); floor matches anndata's
  "zarr>=3.3",
  "numpy>=2.1",
  "scipy>=1.14",
  "h5py>=3.11",
]
# lower bounds only; numpy/scipy/h5py/pandas floors follow anndata's own (the hard dependency sets
# the real minimum anyway), zarr and icechunk floors are the versions the writers were verified against

[project.optional-dependencies]
icechunk = ["icechunk>=2.1.2", "boto3>=1.28"]
dev = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  "moto[s3,server]>=5",  # server: ThreadedMotoServer, needed by tests/test_ic_copy_s3.py
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/A-Jolly-Holly/annizarr"
Documentation = "https://github.com/A-Jolly-Holly/annizarr/tree/main/docs"
Repository = "https://github.com/A-Jolly-Holly/annizarr"
Issues = "https://github.com/A-Jolly-Holly/annizarr/issues"

[project.scripts]
annizarr = "annizarr._cli:main"
anz = "annizarr._cli:main"

[tool.hatch.version]
path = "src/annizarr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/annizarr"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "tests/ic", "tests/ooc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/annizarr/**/_*.py" = ["D"]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src/annizarr"]
warn_unused_ignores = true

# icechunk, moto, numpy, zarr are typed and stay checked
[[tool.mypy.overrides]]
module = [
  "anndata.*",
  "scipy.*",
  "pandas.*",
  "h5py.*",
  "boto3.*",
  "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/ic", "tests/ooc"]  # `from helpers import ...` under importlib mode
addopts = "--import-mode=importlib --strict-markers -m 'not slow' --cov=annizarr --cov-report=term-missing:skip-covered --cov-fail-under=85"
xfail_strict = true
markers = [
  "slow: out-of-core memory ceilings on a large synthetic store (tests/ooc); not a regression test, excluded by default, select with -m slow",
]
filterwarnings = [
  # zarr v3 consolidated metadata isn't part of the spec yet — expected, exercised on purpose
  # by tests/test_ops.py::test_ops_on_consolidated_store and tests/test_storage.py.
  "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification:UserWarning",
  # fixtures deliberately build duplicate-obs-name stores to test append's overlap handling.
  "ignore:Observation names are not unique:UserWarning",
  # anndata 0.12.14+ says this on every zarr write made with auto_shard_zarr_v3 unset; annizarr's own
  # writes set it explicitly, so only the fixtures' anndata writes trigger it.
  "ignore:zarr v3 autosharding will be the default in the next minor release:UserWarning",
]

[tool.coverage.run]
source = ["annizarr"]
omit = ["src/annizarr/_cli/*", "src/annizarr/__main__.py"]
