[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annizarr"
dynamic = ["version"]
description = "AnnData zarr stores: convert, edit, and version with Icechunk"
readme = "README.md"
requires-python = ">=3.12"  # zarr>=3.3 needs >=3.12
license = "MIT"
authors = [{ name = "Alex Holly", email = "alex.holly@alleninstitute.org" }]
dependencies = [
  "anndata>=0.13",  # 0.13 lists X in .layers under None
  "zarr>=3.3",
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.8",
]
# lower bounds only: the floors are the versions the writers were verified against

[project.optional-dependencies]
icechunk = ["icechunk>=2.1.2", "boto3>=1.28"]
dev = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  "moto[s3,server]>=5",  # server: ThreadedMotoServer, needed by tests/test_ic_copy_s3.py
  "scanpy>=1.10",
  "build",
  "twine",
  "pre-commit",
]

[project.scripts]
annizarr = "annizarr._cli:main"
anz = "annizarr._cli:main"

[tool.hatch.version]
path = "src/annizarr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/annizarr"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/annizarr/**/_*.py" = ["D"]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src/annizarr"]
warn_unused_ignores = true

# icechunk, moto, numpy, zarr are typed and stay checked
[[tool.mypy.overrides]]
module = [
  "anndata.*",
  "scanpy.*",
  "scipy.*",
  "pandas.*",
  "h5py.*",
  "boto3.*",
  "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' --cov=annizarr --cov-report=term-missing:skip-covered --cov-fail-under=85"
markers = ["slow: large synthetic store, run with -m slow"]
filterwarnings = [
  # zarr v3 consolidated metadata isn't part of the spec yet — expected, exercised on purpose
  # by tests/test_ops.py::test_ops_on_consolidated_store and tests/test_storage.py.
  "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification:UserWarning",
  # fixtures deliberately build duplicate-obs-name stores to test append's overlap handling.
  "ignore:Observation names are not unique:UserWarning",
]

[tool.coverage.run]
source = ["annizarr"]
omit = ["src/annizarr/_cli/*", "src/annizarr/__main__.py"]
